name: routes
# SL route from each listing to Karlaplan, drawn on the map when a listing is tapped
on:
  push:
    branches: [main]
    paths: ['apartments.geojson', 'fb/listings.json', 'scripts/routes.py', '.github/workflows/routes.yml']
  workflow_run:   # fb-eta commits with the actions token, which doesn't trigger push workflows
    workflows: ['facebook eta']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: routes
jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/routes.py
      - name: commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add routes.json
          git diff --cached --quiet && exit 0
          git commit -m "routes $(date +%F)"
          git pull --rebase
          git push
