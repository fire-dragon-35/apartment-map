<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>apartments near karlaplan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#1b1b1b;--muted:#6b6b6b;--line:#e3e0d8;--near:#1a7f37;--far:#d97706;--new:#fff6d6}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,sans-serif;color:var(--ink)}
header{padding:10px 12px 6px}h1{font-size:16px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:12px}
#map{height:55vh}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
li.new{background:var(--new)}li.sel{outline:2px solid #2563eb;outline-offset:-2px}
.min{flex:none;width:44px;text-align:center;color:var(--muted);font-size:12px;padding-top:2px}
.a{font-weight:600}.s{color:var(--muted);font-size:13px}.flag{color:#b42318;font-size:13px}
a{color:#2563eb}
.kt{font-size:11px;padding:1px 5px;font-weight:600}
.leaflet-popup-content{margin:8px 10px;font-size:13px;line-height:1.35}
</style></head><body>
<header><h1>apartments ≤17k · ≥20 m² · ≥6 months · ≤25 min to karlaplan</h1><p id="meta">loading…</p></header>
<div id="map"></div>
<div class="legend"><span>kr/m²</span><span id="bk"></span><span><i style="background:#2563eb"></i>karlaplan</span><span>size = m² · black ring = new</span></div>
<ol id="list"></ol>
<h3 style="margin:16px 8px 4px;font-size:15px">facebook – check manually</h3>
<ol id="fb"></ol>
<script>
const K=[59.3389,18.0907];
const map=L.map('map',{zoomControl:false,renderer:L.canvas({tolerance:12})}).setView(K,12);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Esri, HERE, OpenStreetMap'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,opacity:.7}).addTo(map);
[2,4,6].forEach(km=>{L.circle(K,{radius:km*1000,color:'#555',weight:1.5,opacity:.85,dashArray:'6 5',fill:false,interactive:false}).addTo(map);
  L.marker([K[0]+km/110.57,K[1]],{icon:L.divIcon({className:'',html:`<span style="white-space:nowrap;font-size:11px;color:#333;font-weight:600;background:#fffc;padding:0 3px;border-radius:3px">${km} km</span>`}),interactive:false}).addTo(map)});
L.circleMarker(K,{radius:7,color:'#fff',weight:2,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('karlaplan',{permanent:true,direction:'right',offset:[6,0],className:'kt'});
const SC={qasa:'#7c3aed',bostadsförmedlingen:'#0e7490',bofrid:'#db2777',samtrygg:'#92400e',homeq:'#4338ca','wåhlin':'#475569',heimstaden:'#0f172a',stena:'#57534e',rikshem:'#9333ea'};
const badge=src=>{const n=String(src||'').split(/[ –(]/)[0];const c=SC[n.toLowerCase()]||'#6b7280';return `<span style="background:${c};color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600">${esc(n)}</span>`};
const m2badge=sz=>{const [r,m]=String(sz).split(',');return `<span style="background:#e2e8f0;color:#0f172a;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700">${esc((m||'').trim())}</span> <span class=s>${esc(r)}</span>`};
const okLen=mi=>{const [a,b]=String(mi||'').split('→').map(x=>x.trim());const e=Date.parse(b);if(isNaN(e))return true;let st=Date.parse(a);if(isNaN(st))st=Date.now();return (e-st)/864e5>=180};
const mi=v=>{let [a,b]=String(v||'').split('→').map(x=>x.trim());a=(!a||/see ad/i.test(a))?'move-in date in ad':(a==='now'?'available now':'from '+a);b=(!b||b==='–'||/indefinite/i.test(b))?'no end date':(/korttid/i.test(b)?'short-term (see ad)':'until '+b);return a+' · '+b};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BK=[[250,'#22c55e','<250'],[300,'#a3e635','250–300'],[350,'#facc15','300–350'],[400,'#fb923c','350–400'],[1e9,'#ef4444','400+']];
const col=k=>BK.find(b=>k<b[0])[1];
fetch('apartments.geojson?'+Date.now()).then(r=>r.json()).then(g=>{
  const P=g.features.filter(f=>f.geometry.type==='Point'&&f.properties.link).map(f=>{const p=f.properties;return{...p,lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],t:parseInt(p['travel (weekday 8:00, SL)'])}}).filter(p=>p.t<=25&&okLen(p['move in'])&&(parseFloat(String(p.size).split(',')[1])||0)>=20).sort((a,b)=>a.t-b.t);
  document.getElementById('meta').textContent=`${P.length} matches · ${P.filter(p=>p.new).length} new · travel = SL, weekday arrive 08:00`;
  document.getElementById('bk').innerHTML=BK.map(b=>`<span style="margin-right:8px"><i style="background:${b[1]}"></i>${b[2]}</span>`).join('');
  const ol=document.getElementById('list'),mk=[];
  P.forEach((p,i)=>{
    const m=L.circleMarker([p.lat,p.lon],{radius:Math.max(6,Math.min(14,Math.sqrt(parseFloat(String(p.size).split(',')[1])||20)*1.25)),color:p.new?'#111':'#fff',weight:p.new?2:1.5,fillColor:col(+p['kr/m²']),fillOpacity:.95}).addTo(map)
      .bindPopup(`<div class="a">${esc(p.address)}${p.new?' <span style="background:#fde68a;border-radius:4px;padding:0 5px;font-size:11px">new</span>':''}</div>${esc(p.rent)} · ${m2badge(p.size)} · <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col(+p['kr/m²'])};margin:0 3px 0 2px"></span>${esc(p['kr/m²'])} kr/m²<br>${p.t} min · ${esc(mi(p['move in']))}<br>${badge(p.source)} · <a href="${esc(p.link)}" target="_blank">open</a>${p.note?`<div class="s">${esc(p.note)}</div>`:''}${p.flag?`<div class="flag">⚠ ${esc(p.flag)}</div>`:''}`,{closeButton:false,maxWidth:260});
    mk.push(m);
    const li=document.createElement('li');li.id='r'+i;if(p.new)li.className='new';
    li.innerHTML=`<div class="min">${p.t} min</div><div><div class="a">${esc(p.address)}</div>
      <div>${esc(p.rent)} · ${m2badge(p.size)} · <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col(+p['kr/m²'])};margin:0 3px 0 2px"></span>${esc(p['kr/m²'])} kr/m²</div><div class="s">${badge(p.source)} · ${esc(mi(p['move in']))} · <a href="${esc(p.link)}" target="_blank">open</a></div>${p.note?`<div class="s">${esc(p.note)}</div>`:''}${p.flag?`<div class="flag">⚠ ${esc(p.flag)}</div>`:''}</div>`;
    li.onclick=e=>{if(e.target.tagName==='A')return;sel(i);map.setView([p.lat,p.lon],14);mk[i].openPopup();window.scrollTo({top:0,behavior:'smooth'})};
    ol.appendChild(li)});
  function sel(i){document.querySelectorAll('li.sel').forEach(x=>x.classList.remove('sel'));document.getElementById('r'+i).classList.add('sel')}
  mk.slice().map((m,i)=>[m,parseFloat(String(P[i].size).split(',')[1])||0]).sort((a,b)=>b[1]-a[1]).forEach(([m])=>m.bringToFront());
}).catch(e=>{document.getElementById('meta').textContent='could not load data: '+e});

fetch('fb/listings.json?'+Date.now()).then(r=>r.json()).then(L=>{
  L.sort((a,b)=>(b.first_seen||'').localeCompare(a.first_seen||''));
  const v=x=>x==null?'?':x;
  document.getElementById('fb').innerHTML=L.map(p=>`<li style="margin:6px 0"><a href="${esc(p.url)}" target="_blank">${esc(v(p.area))}${p.address?', '+esc(p.address):''}</a> · ${v(p.rent)} kr · ${v(p.m2)} m² · ${v(p.start)} → ${p.end||'no end date'}<br><small>${esc(p.summary||'')} · ${esc(p.group||'')}</small></li>`).join('')||'<li>nothing yet</li>';
}).catch(()=>{});
</script></body></html>
