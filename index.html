<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>apartments near karlaplan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#1b1b1b;--muted:#6b6b6b;--line:#e3e0d8;--near:#1a7f37;--far:#d97706;--new:#fff6d6}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,sans-serif;color:var(--ink)}
header{padding:10px 12px 6px}h1{font-size:16px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:12px}
#map{height:55vh}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
li.new{background:var(--new)}li.sel{outline:2px solid #2563eb;outline-offset:-2px}
.min{flex:none;width:44px;text-align:center;color:var(--muted);font-size:12px;padding-top:2px}
.a{font-weight:600}.s{color:var(--muted);font-size:13px}.flag{color:#b42318;font-size:13px}
a{color:#2563eb}
.kt{font-size:11px;padding:1px 5px;font-weight:600}
.leaflet-popup-content{margin:8px 10px;font-size:13px;line-height:1.35}
.lg{background:#fffffff0;border-radius:8px;box-shadow:0 1px 4px #0003;padding:6px 8px;font:11px/1.3 system-ui,sans-serif;color:#444}
.lg .bar{display:flex;margin:3px 0 1px}.lg .bar span{width:26px;height:8px}.lg .bar span:first-child{border-radius:4px 0 0 4px}.lg .bar span:last-child{border-radius:0 4px 4px 0}
.lg .tk{display:flex;padding-left:20px}.lg .tk span{width:26px;font-size:10px;color:#777}
.lg .ky{margin-top:4px;color:#666;font-size:10px}.lg .ky i{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:-1px;margin-right:3px;background:#ccc}
</style></head><body>
<header><h1>apartments near karlaplan</h1><p id="meta">loading…</p></header>
<div id="map"></div>
<ol id="list"></ol>
<script>
const K=[59.3389,18.0907];
const map=L.map('map',{zoomControl:false,renderer:L.canvas({tolerance:12})}).setView(K,12);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Esri, HERE, OpenStreetMap'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,opacity:.7}).addTo(map);
[2,4,6].forEach(km=>{L.circle(K,{radius:km*1000,color:'#8a8a8a',weight:1,opacity:.7,dashArray:'4 4',fill:false,interactive:false}).addTo(map);
  L.marker([K[0]+km/110.57,K[1]],{icon:L.divIcon({className:'',html:`<span style="white-space:nowrap;font-size:10px;color:#777;background:#fffd;padding:0 3px;border-radius:3px">${km} km</span>`}),interactive:false}).addTo(map)});
L.circleMarker(K,{radius:7,color:'#fff',weight:2,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('karlaplan',{permanent:true,direction:'right',offset:[6,0],className:'kt'});
const SC={facebook:'#1877f2',qasa:'#7c3aed',bostadsförmedlingen:'#0e7490',bofrid:'#db2777',samtrygg:'#92400e',homeq:'#4338ca','wåhlin':'#475569',heimstaden:'#0f172a',stena:'#57534e',rikshem:'#9333ea'};
const badge=src=>{const n=String(src||'').split(/[ –(]/)[0];const c=SC[n.toLowerCase()]||'#6b7280';return `<span style="background:${c};color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600">${esc(n)}</span>`};
const m2badge=sz=>{const [r,m]=String(sz).split(',');return `<span style="background:#e2e8f0;color:#0f172a;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700">${esc((m||'').trim())}</span> <span class=s>${esc(r)}</span>`};
const okLen=mi=>{const [a,b]=String(mi||'').split('→').map(x=>x.trim());const e=Date.parse(b);if(isNaN(e))return true;let st=Date.parse(a);if(isNaN(st))st=Date.now();return (e-st)/864e5>=180};
const mi=v=>{let [a,b]=String(v||'').split('→').map(x=>x.trim());a=(!a||/see ad/i.test(a))?'move-in date in ad':(a==='now'?'available now':'from '+a);b=(!b||b==='–'||/indefinite/i.test(b))?'no end date':(/korttid/i.test(b)?'short-term (see ad)':'until '+b);return a+' · '+b};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BK=[[250,'#22c55e','<250'],[300,'#a3e635','250–300'],[350,'#facc15','300–350'],[400,'#fb923c','350–400'],[1e9,'#ef4444','400+']];
const col=k=>BK.find(b=>k<b[0])[1];
const lg=L.control({position:'bottomleft'});lg.onAdd=()=>{const d=L.DomUtil.create('div','lg');
  d.innerHTML=`<b>kr/m²</b><div class="bar">${BK.map(b=>`<span style="background:${b[1]}"></span>`).join('')}</div><div class="tk">${BK.slice(0,-1).map(b=>`<span>${b[0]}</span>`).join('')}</div>
  <div class="ky"><i style="border:2px solid #111"></i>new &nbsp; <i style="border:2px dashed #1877f2"></i>facebook (~ area centre) &nbsp; size = m²</div>`;return d};lg.addTo(map);

Promise.all([fetch('apartments.geojson?'+Date.now()).then(r=>r.json()),fetch('fb/listings.json?'+Date.now()).then(r=>r.json()).catch(()=>[]),fetch('routes.json?'+Date.now()).then(r=>r.json()).catch(()=>({}))]).then(([g,F,R])=>{
  const RC={metro:{'10':'#0089ca','11':'#0089ca','13':'#d71d24','14':'#d71d24','17':'#148f42','18':'#148f42','19':'#148f42'},train:'#ec619f',tram:'#d77d00',bus:'#e3000f',boat:'#0e7490',other:'#6b7280'};
  const rl=L.layerGroup().addTo(map);
  const draw=p=>{rl.clearLayers();const r=R[(+p.lat).toFixed(4)+','+(+p.lon).toFixed(4)];if(!r)return;
    r.forEach(([md,n,c])=>{if(md==='walk'){L.polyline(c,{color:'#444',weight:3,dashArray:'2 6',interactive:false}).addTo(rl);return}
      const k=md==='metro'?(RC.metro[n]||'#0089ca'):(RC[md]||RC.other);L.polyline(c,{color:'#fff',weight:8,opacity:.9,interactive:false}).addTo(rl);L.polyline(c,{color:k,weight:5,interactive:false}).addTo(rl);
      if(n)L.marker(c[Math.floor(c.length/2)],{interactive:false,icon:L.divIcon({className:'',html:`<span style="background:${k};color:#fff;font:700 11px system-ui;padding:1px 5px;border-radius:9px;border:1.5px solid #fff;white-space:nowrap">${md==='metro'?'T':md==='train'?'J':md==='tram'?'L':md==='boat'?'B':''}${esc(n)}</span>`})}).addTo(rl)})};
  const fNew=F.reduce((a,p)=>p.first_seen>a?p.first_seen:a,'');
  const FB=F.map(p=>({address:(p.area??'?')+(p.address?', '+p.address:''),rent:p.rent?p.rent+' kr':'? kr',size:`${p.rooms?p.rooms+' rok':''}, ${p.m2?p.m2+' m²':'? m²'}`,
    'kr/m²':p.rent&&p.m2?Math.round(p.rent/p.m2):null,lat:p.lat,lon:p.lon,t:p.t??Infinity,approx:true,source:'facebook',link:p.url,
    'move in':`${p.start??''} → ${p.end??''}`,note:[p.furnished===true?'furnished':p.furnished===false?'unfurnished':'',p.summary].filter(Boolean).join(' · '),new:p.first_seen===fNew}));
  const P=g.features.filter(f=>f.geometry.type==='Point'&&f.properties.link).map(f=>{const p=f.properties;return{...p,lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],t:parseInt(p['travel (weekday 8:00, SL)'])}}).filter(p=>p.t<=30&&okLen(p['move in'])&&(parseFloat(String(p.size).split(',')[1])||0)>=20).concat(FB.filter(p=>p.t<=30&&okLen(p['move in'])&&(parseFloat(String(p.size).split(',')[1])||20)>=20)).sort((a,b)=>a.t-b.t);
  document.getElementById('meta').innerHTML=`<b>${P.length}</b> matches · <b>${P.filter(p=>p.new).length}</b> new · ≤17k · ≥20 m² · ≥6 months · ≤30 min by SL (weekday 08:00)`;
  const ol=document.getElementById('list'),mk=[];
  const tm=p=>p.t===Infinity?'? min':(p.approx?'~':'')+p.t+' min';
  const kd=p=>p['kr/m²']==null?'':` · <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col(+p['kr/m²'])};margin:0 3px 0 2px"></span>${esc(p['kr/m²'])} kr/m²`;
  P.forEach((p,i)=>{
    const body=`${esc(p.rent)} · ${m2badge(p.size)}${kd(p)}`;
    const m=p.lat&&p.lon?L.circleMarker([p.lat,p.lon],{radius:Math.max(6,Math.min(14,Math.sqrt(parseFloat(String(p.size).split(',')[1])||20)*1.25)),color:p.approx?'#1877f2':p.new?'#111':'#fff',weight:p.approx||p.new?2:1.5,dashArray:p.approx?'3 3':null,fillColor:p['kr/m²']==null?'#9ca3af':col(+p['kr/m²']),fillOpacity:.95}).addTo(map)
      .bindPopup(`<div class="a">${esc(p.address)}${p.new?' <span style="background:#fde68a;border-radius:4px;padding:0 5px;font-size:11px">new</span>':''}</div>${body}<br>${tm(p)}${p.approx?' (area centre)':''} · ${esc(mi(p['move in']))}<br>${badge(p.source)} · <a href="${esc(p.link)}" target="_blank">open</a>${p.note?`<div class="s">${esc(p.note)}</div>`:''}${p.flag?`<div class="flag">⚠ ${esc(p.flag)}</div>`:''}`,{closeButton:false,maxWidth:260}):null;
    if(m){m.on('popupopen',()=>draw(p));m.on('popupclose',()=>rl.clearLayers());}
    mk.push(m);
    const li=document.createElement('li');li.id='r'+i;if(p.new)li.className='new';
    li.innerHTML=`<div class="min">${tm(p)}</div><div><div class="a">${esc(p.address)}</div>
      <div>${body}</div><div class="s">${badge(p.source)} · ${esc(mi(p['move in']))} · <a href="${esc(p.link)}" target="_blank">open</a></div>${p.note?`<div class="s">${esc(p.note)}</div>`:''}${p.flag?`<div class="flag">⚠ ${esc(p.flag)}</div>`:''}</div>`;
    li.onclick=e=>{if(e.target.tagName==='A')return;if(!m)return window.open(p.link,'_blank');sel(i);m.openPopup();const ls=rl.getLayers().filter(x=>x.getBounds);ls.length?map.fitBounds(L.featureGroup(ls).getBounds().extend([p.lat,p.lon]),{padding:[40,40],maxZoom:15}):map.setView([p.lat,p.lon],14);window.scrollTo({top:0,behavior:'smooth'})};
    ol.appendChild(li)});
  function sel(i){document.querySelectorAll('li.sel').forEach(x=>x.classList.remove('sel'));document.getElementById('r'+i).classList.add('sel')}
  mk.map((m,i)=>[m,parseFloat(String(P[i].size).split(',')[1])||0]).filter(x=>x[0]).sort((a,b)=>b[1]-a[1]).forEach(([m])=>m.bringToFront());
}).catch(e=>{document.getElementById('meta').textContent='could not load data: '+e});

</script></body></html>
